<div class="auth-wrapper">
  <div class="auth-background"></div>
  <div class="auth-content">
    <div class="glass-card">
      <div class="card-body text-center p-5">
        <div class="app-logo mb-4">
          <div class="logo-circle">
            <i class="feather icon-shield"></i>
          </div>
        </div>
        
        <h2 class="auth-title mb-2">Welcome Back</h2>
        <p class="text-muted mb-4 subtitle">Jay Laxmi Jewellers Dhiran System</p>

        <div class="form-floating mb-3">
          <input type="text" class="form-control custom-input" id="username" placeholder="Username" [(ngModel)]="username" autocomplete="off" />
          <label for="username">Username</label>
        </div>

        <div class="form-floating mb-4 position-relative">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control custom-input" id="password" placeholder="Password" [(ngModel)]="password" name="password" />
          <label for="password">Password</label>
          <span class="pwd-toggle" (click)="showPassword = !showPassword">
            <i class="feather" [ngClass]="showPassword ? 'icon-eye-off' : 'icon-eye'"></i>
          </span>
        </div>

        <div *ngIf="errorMessage" class="error-box mb-4 animate__animated animate__headShake">
          <i class="feather icon-alert-circle me-2"></i>
          {{ errorMessage }}
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check custom-check">
            <input class="form-check-input" type="checkbox" id="saveDetails" checked>
            <label class="form-check-label" for="saveDetails">Remember Me</label>
          </div>
          <a href="javascript:" class="forgot-link">Forgot?</a>
        </div>

        <button class="btn login-btn w-100 mb-4" (click)="login()">
          <span>Log In</span>
          <i class="feather icon-arrow-right ms-2 mt-1"></i>
        </button>

        <div class="auth-footer py-2">
          <span class="text-muted">New user? </span>
          <a [routerLink]="['/register']" class="register-link fw-bold">Contact Admin</a>
        </div>
      </div>
    </div>
  </div>
</div>
