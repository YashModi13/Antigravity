<div class="auth-wrapper">
  <div class="auth-background"></div>
  <div class="auth-content">
    <div class="glass-card">
      <div class="card-body text-center p-5">
        <div class="app-logo mb-4">
          <div class="logo-circle">
            <i class="feather icon-user-plus"></i>
          </div>
        </div>
        
        <h2 class="auth-title mb-2">Create Account</h2>
        <p class="text-muted mb-4 subtitle">Contact Administrator to Enable Access</p>

        <div class="form-floating mb-3">
          <input type="text" class="form-control custom-input" id="username" placeholder="Full Name" autocomplete="off" />
          <label for="username">Full Name</label>
        </div>

        <div class="form-floating mb-3">
          <input type="email" class="form-control custom-input" id="email" placeholder="Email Address" />
          <label for="email">Email Address</label>
        </div>

        <div class="form-floating mb-4 position-relative">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control custom-input" id="password" placeholder="Password" />
          <label for="password">Choose Password</label>
          <span class="pwd-toggle" (click)="showPassword = !showPassword">
            <i class="feather" [ngClass]="showPassword ? 'icon-eye-off' : 'icon-eye'"></i>
          </span>
        </div>

        <div class="form-check custom-check text-start mb-4">
          <input class="form-check-input" type="checkbox" id="terms" checked>
          <label class="form-check-label" for="terms">I agree to the System Security Policy</label>
        </div>

        <button class="btn register-btn w-100 mb-4">
          <span>Request Activation</span>
          <i class="feather icon-check-circle ms-2 mt-1"></i>
        </button>

        <div class="auth-footer py-2">
          <span class="text-muted">Direct to </span>
          <a [routerLink]="['/login']" class="login-link fw-bold">Login Screen</a>
        </div>
      </div>
    </div>
  </div>
</div>
